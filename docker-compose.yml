# Referência de infraestrutura para rodar o MVP em produção/homologação.
# NÃO foi executado nesta máquina de desenvolvimento (validação local usou
# embedded-postgres em .devtools/pg, ver STATUS.md). Ajuste senhas/segredos
# antes de usar em qualquer ambiente real.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: descomplica
      POSTGRES_PASSWORD: troque-esta-senha
      POSTGRES_DB: descomplica
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: troque-esta-senha
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    environment:
      DATABASE_URL: "postgresql://descomplica:troque-esta-senha@postgres:5432/descomplica"
      JWT_SECRET: "troque-por-um-segredo-aleatorio-bem-grande"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NEXT_PUBLIC_WHATSAPP_NUMBER: "5511999999999"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "troque-esta-senha"
      S3_BUCKET: "descomplica-uploads"
      S3_PUBLIC_URL: "http://localhost:9000/descomplica-uploads"
      STRIPE_SECRET_KEY: "sk_test_substitua"
      STRIPE_WEBHOOK_SECRET: "whsec_substitua"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
